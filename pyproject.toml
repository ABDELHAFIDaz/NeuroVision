[project]
name = "neurovision"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ABD ELHAFID AZLIGUE", email = "abdelhafidazligue162@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "streamlit>=1.65.0",
    "tensorflow>=2.22.0rc0",
]

[project.scripts]
neurovision = "neurovision:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
